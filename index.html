<style>
:root{--bg:#f4f5f9;--card:#fff;--tx:#14161f;--mu:#6b7186;--bd:#e2e5ee;--ac:#5b6cff;--ac2:#3ecf8e;--neg:#ff5d6c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1118;--card:#171b26;--tx:#eef0f7;--mu:#8a91a8;--bd:#262c3b}}
:root[data-theme="dark"]{--bg:#0e1118;--card:#171b26;--tx:#eef0f7;--mu:#8a91a8;--bd:#262c3b}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;min-height:100vh}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:8px 2px;font:inherit;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}nav button.on{color:var(--ac);font-weight:600}
.brand{display:none}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:18px 16px 96px}
h1{font-size:24px;margin:4px 0 2px}h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--mu);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
input,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px;font:inherit;min-height:46px}
input:focus{outline:2px solid var(--ac);border-color:transparent}
.btn{width:100%;background:var(--ac);color:#fff;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:600;font-size:17px;cursor:pointer;margin-top:14px}
.btn:active{transform:scale(.98)}.btn.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd);font-size:15px;padding:11px;margin-top:0}
.big{font-size:34px;font-weight:700;letter-spacing:-.5px}.mu{color:var(--mu);font-size:14px}
.bar{height:10px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:9px;transition:width .4s}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row b{display:block}.pos{color:var(--ac2)}.neg{color:var(--neg)}
.ib{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:10px;width:40px;height:40px;font-size:16px;cursor:pointer}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:9px;border-radius:9px;font:inherit;cursor:pointer}.seg button.on{background:var(--ac);color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stats .card{margin:0;padding:14px}.stats .big{font-size:24px}
.chart{overflow-x:auto}svg text{fill:var(--mu);font-size:11px}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:18px;width:min(92vw,420px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.55)}
.msg{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ac2);color:#06251a;padding:10px 18px;border-radius:30px;font-weight:600;z-index:9}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.calg>span{font-size:12px;color:var(--mu)}
.day{aspect-ratio:1;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}.day small{font-size:10px;min-height:12px}
.day.w{background:color-mix(in srgb,var(--ac2) 28%,var(--card));border-color:var(--ac2)}.day.v{background:color-mix(in srgb,#f5a524 30%,var(--card));border-color:#f5a524}.day.t{outline:2px solid var(--ac)}
.day.wg{background:color-mix(in srgb,#9aa0b4 22%,var(--card));border-color:#9aa0b4}
.pill{display:inline-block;font-size:11px;color:#fff;padding:1px 8px;border-radius:20px;margin-top:2px}
details.ms{margin:0;padding:0 12px;background:var(--bg);border-radius:12px}details.ms summary{padding:12px 0;font-weight:400}.ck{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--tx);margin:0;padding:9px 2px;cursor:pointer}.ck input{width:auto;min-height:0;margin:0;accent-color:var(--ac)}.day.s{outline:2px dashed #f5a524;background:color-mix(in srgb,#f5a524 45%,var(--card))}
.cn{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.cn b{font-size:18px;text-transform:capitalize}.tile{margin-bottom:12px}.msg.er{background:var(--neg);color:#fff}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center}#lock[hidden]{display:none}body.locked #app{visibility:hidden}
.lk{width:min(88vw,320px);text-align:center}.lt{font-weight:600;margin-bottom:18px;font-size:17px}
.dots{display:flex;gap:16px;justify-content:center;margin-bottom:34px}.dots i{width:13px;height:13px;border-radius:50%;background:var(--bd);transition:.15s}.dots i.on{background:var(--ac);transform:scale(1.15)}
.dots.sh{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;justify-items:center}
.kp button{width:68px;height:68px;border-radius:50%;border:0;background:var(--card);color:var(--tx);font:inherit;font-size:24px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center}
.kp button:active{transform:scale(.92);background:var(--ac);color:#fff}
.le{min-height:22px;margin-top:18px;color:var(--neg);font-size:14px}.lc{margin-top:6px;background:none;border:0;color:var(--mu);font:inherit;font-size:15px;cursor:pointer;padding:10px}
.fold>h2{cursor:pointer;margin:0;display:flex;justify-content:space-between;align-items:center}.fold>h2::after{content:"▾";color:var(--mu);transition:transform .2s}.fold.open>h2{margin-bottom:12px}.fold.open>h2::after{transform:rotate(180deg)}.fold:not(.open)>*:not(h2){display:none}
.mg{margin-top:0}.mg summary{padding:0;gap:10px}.mg summary>span:first-child{flex:1;text-transform:capitalize}.mg[open] summary{margin-bottom:6px}
.hmw{overflow-x:auto}.hm{display:inline-grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px}.hm i{display:block;border-radius:3px;background:var(--bg);border:1px solid var(--bd)}
.chips{display:flex;gap:8px;margin-bottom:14px}.chips button{flex:1;min-width:0;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:14px;padding:8px 2px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25}.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}.chips small{font-size:10px}.chips b{font-size:17px;color:inherit}.chips i{font-style:normal;font-size:10px;height:12px}
.tg{display:flex;align-items:center;justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:4px}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}.swb{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--bd);cursor:pointer;padding:0}.swb.on{box-shadow:0 0 0 3px var(--tx)}.sw input[type=color]{width:42px;height:34px;min-height:0;padding:2px;border-radius:50%}
#prt{display:none}
@media print{#app,dialog,.msg{display:none!important}body{background:#fff!important}#prt{display:block;color:#000;background:#fff;font:13px system-ui,sans-serif}#prt table{width:100%;border-collapse:collapse;margin:12px 0}#prt th,#prt td{border-bottom:1px solid #bbb;padding:6px;text-align:left}}
.switch{font-size:17px;position:relative;display:inline-block;width:3.5em;height:2em;cursor:pointer;flex:none}
.switch input{opacity:0;width:0;height:0;min-height:0;padding:0;border:0}
.slider{--background:#20262c;position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:var(--background);transition:.5s;border-radius:30px}
.slider:before{position:absolute;content:"";height:1.4em;width:1.4em;border-radius:50%;left:10%;bottom:15%;box-shadow:inset 8px -4px 0 0 #ececd9,-4px 1px 4px 0 #dadada;background:var(--background);transition:.5s}
.decoration{position:absolute;content:"";height:2px;width:2px;border-radius:50%;right:20%;top:15%;background:#e5f041e6;backdrop-filter:blur(10px);transition:all .5s;box-shadow:-7px 10px 0 #e5f041e6,8px 15px 0 #e5f041e6,-17px 1px 0 #e5f041e6,-20px 10px 0 #e5f041e6,-7px 23px 0 #e5f041e6,-15px 25px 0 #e5f041e6}
input:checked~.decoration{transform:translateX(-20px);width:10px;height:10px;background:#fff;box-shadow:-12px 0 0 #fff,-6px 0 0 1.6px #fff,5px 15px 0 1px #fff,1px 17px 0 #fff,10px 17px 0 #fff}
input:checked+.slider{background-color:#5494de}
input:checked+.slider:before{transform:translateX(100%);box-shadow:inset 15px -4px 0 15px #efdf2b,0 0 10px 0 #efdf2b}
details{margin-top:16px;border:1px solid var(--bd);border-radius:14px;padding:0 14px}
summary{cursor:pointer;padding:14px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between}summary::after{content:"▾";color:var(--mu);transition:transform .2s}details[open] summary::after{transform:rotate(180deg)}summary::-webkit-details-marker{display:none}
.rule{display:grid;grid-template-columns:1fr 1fr 78px 40px;gap:8px;align-items:end;margin-bottom:10px}
.rule input{padding:10px 8px}
@media(min-width:800px){
 nav{top:0;bottom:auto;right:auto;width:210px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:20px 12px;gap:4px}
 nav button{flex:none;flex-direction:row;font-size:15px;gap:12px;padding:12px 14px;border-radius:12px}nav button.on{background:var(--bg)}
 .brand{display:block;font-weight:700;font-size:18px;padding:0 14px 14px}
 main{margin-left:210px;max-width:none;padding:32px 40px}main>*{max-width:760px}
 #app{display:block}
}
</style>
</head>
<body>
<div id="app"><nav id="nav"></nav><main id="view"></main></div>
<dialog id="dlg"></dialog><div id="prt"></div><div id="lock" hidden></div>
<script>
const $=s=>document.querySelector(s);
const KEY="zeit_v1";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={entries:{},vac:{},notes:{},set:{weekly:40,days:5,rate:0,theme:"",rules:[]}},tab="home",range="week",advOpen=false,calM=new Date(new Date().getFullYear(),new Date().getMonth(),1);
try{const r=JSON.parse(localStorage.getItem(KEY)||"null");if(r){S.entries=r.entries||{};S.vac=r.vac||{};S.notes=r.notes||{};Object.assign(S.set,r.set||{})}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const autoPause=(a,b)=>(S.set.autoPause&&tm(b)-tm(a)>360)?30:0;
const BS=String.fromCharCode(92);
const dep=id=>(S.set.depts||[]).find(x=>x.id===id);
const deptTag=e=>{const d=S.set.deptOn&&dep(e.dept);return d?`<br><span class="pill" style="background:${d.color}">${esc(d.name||"Schicht")}</span>`:""};
const dst=e=>{const d=e&&S.set.deptOn&&dep(e.dept);return d?`style="background:color-mix(in srgb,${d.color} 38%,var(--card));border-color:${d.color}"`:""};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const pd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const tm=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const net=e=>Math.max(0,(tm(e.end)-tm(e.start)-(+e.pause||0))/60);
const f1=n=>n.toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:2});
let RV=0;const eur=n=>S.set.hideAmt&&!RV?"••• €":n.toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

function chart(items,soll){

 const y=v=>H-pb-(v/mx)*(H-pb-pt),step=(W-40)/items.length;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Arbeitsstunden">`;
 s+=`<line x1="30" x2="${W}" y1="${y(soll)}" y2="${y(soll)}" stroke="var(--neg)" stroke-dasharray="4 4"/><text x="0" y="${y(soll)+4}">${f1(soll)}</text>`;
 items.forEach((it,i)=>{const x=34+i*step+(step-bw)/2;
  s+=`<rect x="${x}" y="${y(it.v)}" width="${bw}" height="${Math.max(0,H-pb-y(it.v))}" rx="5" fill="${it.v>=soll?"var(--ac2)":"var(--ac)"}" opacity="${it.v?1:.25}"><title>${it.t}: ${f1(it.v)} h</title></rect><text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${it.l}</text>`});

}

 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([L.join(CR)],{type:"text/calendar;charset=utf-8"}));a.download="arbeitszeit-"+lab.split(" ").join("-")+".ics";a.click()}

 rows.forEach(x=>L.push(x.e?[x.k,x.e.start,x.e.end,x.e.pause,net(x.e).toFixed(2).replace(".",","),"Arbeit"].join(";"):[x.k,"","","","","Urlaub"].join(";")));
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+L.join("\n")],{type:"text/csv;charset=utf-8"}));a.download="arbeitszeit-"+lab.replace(/\s/g,"-")+".csv";a.click()}
function readShifts(){const q=c=>[...document.querySelectorAll(c)],n=q(".sn"),s=q(".ss"),e=q(".se"),p=q(".sp");return n.map((x,i)=>({name:x.value.trim(),start:s[i].value||"08:00",end:e[i].value||"16:00",pause:+p[i].value||0}))}
function readRules(){const f=[...document.querySelectorAll(".rf")],t=[...document.querySelectorAll(".rt")],p=[...document.querySelectorAll(".rp")];return f.map((x,i)=>({from:x.value||"00:00",to:t[i].value||"00:00",pct:+p[i].value||0}))}
let fo={};
function bindSet(){
 document.querySelectorAll("#view>.card").forEach(c=>{const h=c.querySelector(":scope>h2");if(!h)return;const id=h.textContent;c.classList.add("fold");if(fo[id])c.classList.add("open");h.onclick=()=>{c.classList.toggle("open");fo[id]=c.classList.contains("open")}});
 $("#sv").onclick=()=>{const w=+$("#w").value,d=Math.round(+$("#d").value);if(!(w>0)||!(d>=1&&d<=7))return alert("Bitte gültige Werte eingeben.");
  S.set.weekly=w;S.set.days=d;S.set.rate=+$("#r").value||0;S.set.rules=readRules();S.set.hol=$("#hl").value==="1";S.set.autoPause=$("#ap").value==="1";save();toast("Gespeichert ✓");render()};
 $("#adv").ontoggle=e=>advOpen=e.target.open;
 $("#ar").onclick=()=>{S.set.rules=readRules();S.set.rules.push({from:"20:00",to:"21:00",pct:25});advOpen=true;render()};
 document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const r=readRules();r.splice(+b.dataset.rm,1);S.set.rules=r;advOpen=true;save();render()});
 $("#switch").onchange=e=>{S.set.theme=e.target.checked?"light":"dark";save();render()};
 document.querySelectorAll(".swb").forEach(b=>b.onclick=()=>{S.set.accent=b.dataset.c;save();render()});
 $("#cc").onchange=e=>{S.set.accent=e.target.value;save();render()};
 document.querySelectorAll(".sh").forEach(i=>i.onchange=()=>{S.set.shifts=readShifts();save()});
 $("#sa").onclick=()=>{S.set.shifts=readShifts();S.set.shifts.push({name:"",start:"14:00",end:"21:00",pause:0});save();render()};
 document.querySelectorAll("[data-sd]").forEach(b=>b.onclick=()=>{const r=readShifts();r.splice(+b.dataset.sd,1);S.set.shifts=r;save();render()});
 $("#dpon").onchange=e=>{S.set.deptOn=e.target.value==="1";save();render()};
 const rd=()=>{const n=[...document.querySelectorAll(".dn")],c=[...document.querySelectorAll(".dc")];return (S.set.depts||[]).map((x,i)=>({id:x.id,name:n[i].value.trim(),color:c[i].value}))};
 document.querySelectorAll(".dh").forEach(i=>i.onchange=()=>{S.set.depts=rd();save()});
 if($("#da"))$("#da").onclick=()=>{S.set.depts=rd();S.set.depts.push({id:"d"+Date.now().toString(36),name:"",color:["#e5393f","#2f80ed","#22b573","#f59e0b","#8b5cf6","#ec4899"][S.set.depts.length%6]});save();render()};
 document.querySelectorAll("[data-dd]").forEach(b=>b.onclick=()=>{S.set.depts=rd();S.set.depts.splice(+b.dataset.dd,1);save();render()});
 $("#pnon").onchange=async e=>{if(e.target.value==="1")await pinSetup();else await pinOff();render()};
 if($("#fcon"))$("#fcon").onchange=async e=>{if(e.target.value==="1")await faceSetup();else{const p=getPin();p.cred="";setPin(p)}render()};
 if($("#pnch"))$("#pnch").onclick=async()=>{await pinSetup();render()};
 $("#pdf").onclick=pdfRep;$("#ics").onclick=icsRep;
 $("#hdon").onchange=e=>{S.set.hideAmt=e.target.value==="1";save();render()};
 $("#pr").onclick=printRep;$("#csv").onclick=csvRep;
 $("#ex").onclick=()=>{S.set.lastBackup=ymd(today());save();const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="zeiterfassung-backup.json";a.click()};
 $("#im").onclick=()=>$("#fi").click();
 $("#fi").onchange=async e=>{try{const r=JSON.parse(await e.target.files[0].text());if(!r.entries)throw 0;S.entries=r.entries;S.vac=r.vac||{};S.notes=r.notes||{};Object.assign(S.set,r.set||{});save();toast("Importiert ✓");render()}catch(x){alert("Ungültige Datei.")}};
 $("#rs").onclick=function(){ask(this,"Nochmal tippen: ALLES löschen",()=>{S.entries={};S.vac={};S.notes={};save();render()})};
}
const PK="zeit_pin",FACE='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 10v1M15 10v1M12 10v3h-1M9.5 16c1.5 1.2 3.5 1.2 5 0"/></svg>';
const getPin=()=>{try{return JSON.parse(localStorage.getItem(PK)||"null")}catch(e){return null}};
const setPin=o=>{try{if(o)localStorage.setItem(PK,JSON.stringify(o));else localStorage.removeItem(PK)}catch(e){}};
const sha=async(s,salt)=>{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")};
const lockHide=()=>{$("#lock").hidden=true;document.body.classList.remove("locked")};
function askPin(title,o={}){return new Promise(res=>{
 const L=$("#lock");let v="",done=false,lk=false;L.hidden=false;document.body.classList.add("locked");
 L.innerHTML=`<div class="lk"><div class="lt">${title}</div><div class="dots">${"<i></i>".repeat(4)}</div><div class="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button data-k="face"${o.face?"":' style="visibility:hidden"'}>${FACE}</button><button data-k="0">0</button><button data-k="del">⌫</button></div><div class="le"></div>${o.cancel?'<button class="lc" data-k="x">Abbrechen</button>':""}</div>`;
 const dots=[...L.querySelectorAll(".dots i")],fin=r=>{if(done)return;done=true;document.removeEventListener("keydown",kd);res(r)};
 const press=k=>{if(done||lk)return;if(k==="x")return fin(null);if(k==="face")return o.face&&fin("FACE");if(k==="del")v=v.slice(0,-1);else if(v.length<4)v+=k;dots.forEach((d,i)=>d.classList.toggle("on",i<v.length));if(v.length===4){lk=true;setTimeout(()=>fin(v),120)}};
 const kd=e=>{if(/^\d$/.test(e.key))press(e.key);else if(e.key==="Backspace")press("del");else if(e.key==="Escape"&&o.cancel)press("x")};
 document.addEventListener("keydown",kd);
 L.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>press(b.dataset.k));
 if(o.msg){L.querySelector(".le").textContent=o.msg;L.querySelector(".dots").classList.add("sh")}
})}
async function faceAuth(p){try{const r=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:"public-key",id:Uint8Array.from(atob(p.cred),c=>c.charCodeAt(0))}],userVerification:"required",timeout:60000}});return !!r}catch(e){return false}}
async function unlockFlow(){const p=getPin();if(!p){lockHide();return}
 let fails=0,msg="";
 for(;;){const v=await askPin("PIN eingeben",{face:!!p.cred,msg});msg="";
  if(v==="FACE"){if(await faceAuth(p))break;msg="Face ID fehlgeschlagen";continue}
  if(await sha(v,p.salt)===p.hash)break;
  fails++;msg="Falsche PIN";
  if(fails>=5){const e=$("#lock .le");if(e)e.textContent="Zu viele Versuche – bitte 30 Sekunden warten";await new Promise(r=>setTimeout(r,30000));fails=0}}
 lockHide()}
async function pinSetup(){if(!(window.crypto&&crypto.subtle))return alert("Die PIN funktioniert nur über https (z. B. GitHub Pages).");
 const a=await askPin("Neue PIN wählen",{cancel:true});if(a===null)return lockHide();
 const b=await askPin("PIN wiederholen",{cancel:true});if(b===null)return lockHide();
 lockHide();if(a!==b)return alert("Die PINs stimmen nicht überein.");
 const salt=[...crypto.getRandomValues(new Uint8Array(8))].join(""),old=getPin();setPin({salt,hash:await sha(a,salt),cred:old&&old.cred||""});toast("PIN gespeichert 🔒")}
async function pinOff(){const p=getPin();if(!p)return;const v=await askPin("PIN zum Ausschalten",{cancel:true});lockHide();if(v===null)return;if(await sha(v,p.salt)===p.hash){setPin(null);toast("PIN-Sperre aus")}else alert("Falsche PIN.")}
async function faceSetup(){if(!window.PublicKeyCredential)return alert("Face ID / Touch ID wird von diesem Browser nicht unterstützt.");
 try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:"Zeiterfassung"},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:"nutzer",displayName:"Zeiterfassung"},pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},timeout:60000}});
  const p=getPin();p.cred=btoa(String.fromCharCode(...new Uint8Array(c.rawId)));setPin(p);toast("Face ID aktiviert ✓")}catch(e){alert("Face ID konnte nicht eingerichtet werden.")}}
let hiddenAt=0;document.addEventListener("visibilitychange",()=>{if(document.hidden)hiddenAt=Date.now();else if(getPin()&&hiddenAt&&Date.now()-hiddenAt>60000&&$("#lock").hidden)unlockFlow()});
render();
unlockFlow();
</script>
